# Deploy the web service after creating a PostgreSQL database in Render.
# Add DATABASE_URL, SESSION_SECRET and (if required) PGSSL in the Render environment.
services:
  - type: web
    name: our-chat-v2
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:setup
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PGSSL
        value: "true"
